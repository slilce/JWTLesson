# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/jwt_lesson
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Secret
jwt.secret=${JWT_SECRET:myTemporaryDevelopmentSecretKey12345678901234567890}
# Lesson JWT lifetime: one hour by default.
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Initial users are created on startup if absent. Supply passwords through environment variables.
app.init.admin.username=admin
app.init.admin.password=${ADMIN_PASSWORD}
app.init.user.username=user
app.init.user.password=${USER_PASSWORD}
